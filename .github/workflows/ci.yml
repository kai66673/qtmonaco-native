name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm cmake ninja git gcc qt6-base
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: ninja -C build
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Install + consumer smoke (Phase F)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/qmn-prefix"
          cmake -S examples/consumer -B build-consumer -G Ninja \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/qmn-prefix"
          cmake --build build-consumer
          ./build-consumer/qmn-consumer-smoke

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgl1-mesa-dev libxkbcommon0 qt6-base-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: ninja -C build
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Install + consumer smoke (Phase F)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/qmn-prefix"
          cmake -S examples/consumer -B build-consumer -G Ninja \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/qmn-prefix"
          cmake --build build-consumer
          ./build-consumer/qmn-consumer-smoke

  # Phase F: the shipping wheel pipeline is the pinned container (Qt 6.12 +
  # PySide6 6.12 + auditwheel/patchelf baked in) - it configures, builds,
  # abi3-tags, auditwheel-repairs to manylinux_2_34, and smoke+parity-tests
  # the REPAIRED wheel, all inside bindings/build_in_container.sh --wheel.
  # The [tool.cibuildwheel] config in pyproject.toml is the future PyPI flow,
  # not this job (its before-all still needs the Qt bootstrap).
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + repair + smoke the PySide6 wheel
        env:
          REBUILD_IMAGE: "1"
        run: ./bindings/build_in_container.sh --wheel
      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: qmn-native-wheel
          path: dist/repaired/*.whl
