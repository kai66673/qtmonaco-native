name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm cmake ninja git gcc qt6-base
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: ninja -C build
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Install + consumer smoke (Phase F)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/qmn-prefix"
          cmake -S examples/consumer -B build-consumer -G Ninja \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/qmn-prefix"
          cmake --build build-consumer
          ./build-consumer/qmn-consumer-smoke

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgl1-mesa-dev libxkbcommon0 qt6-base-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: ninja -C build
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Install + consumer smoke (Phase F)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/qmn-prefix"
          cmake -S examples/consumer -B build-consumer -G Ninja \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/qmn-prefix"
          cmake --build build-consumer
          ./build-consumer/qmn-consumer-smoke
